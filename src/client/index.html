<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Time Management - Home</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f0fdfa; padding-bottom: 40px; }
        nav { display: flex; gap: 16px; padding: 16px; background-color: #1e293b; }
        nav a { color: #fff; text-decoration: none; font-size: 16px; }
        nav a.active { font-weight: bold; text-decoration: underline; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .btn-primary { padding: 10px 16px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-dark { padding: 10px 16px; background: #475569; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .layout-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .layout-grid { grid-template-columns: 2fr 1fr; } }
        .panel-grey { background: #cbd5e1; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; gap: 16px; }
        .panel-white { background: white; padding: 20px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .group-card { background: white; padding: 16px; border-radius: 6px; border: 1px solid #94a3b8; cursor: pointer; text-decoration: none; color: inherit; display: block; }
        .group-card h4 { margin: 0 0 8px 0; color: #0284c7; }
        .member-ticker { font-size: 14px; color: #64748b; font-style: italic; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .matrix-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }
        .time-slot { padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; cursor: pointer; user-select: none; font-weight: 500; background: #f8fafc; transition: all 0.15s; }
        .time-slot.selected { background: #22c55e; border-color: #16a34a; color: white; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: white; padding: 24px; border-radius: 8px; width: 400px; display: flex; flex-direction: column; gap: 14px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="group.html">Group Workspace</a>
        <a href="schedule.html">Timeline Scheduler</a>
    </nav>

    <div class="container">
        <div class="top-bar">
            <button class="btn-primary" onclick="toggleModal(true)">➕ Create Group</button>
            <button class="btn-dark" onclick="triggerNotifications()">🔔 Notifications (1)</button>
        </div>

        <div class="layout-grid">
            <div class="panel-grey">
                <h3 style="margin:0">Your Active Groups Workspace</h3>
                <a href="group.html" class="group-card">
                    <h4>Project Group 05</h4>
                    <p style="margin: 0 0 8px 0;">⏳ <strong>Next Event:</strong> Milestone 2 due Friday</p>
                    <div class="member-ticker">👥 Members: Alice → Bob → Charlie</div>
                </a>
                <a href="group.html" class="group-card">
                    <h4>Study Session Team</h4>
                    <p style="margin: 0 0 8px 0;">⏳ <strong>Next Event:</strong> Exam Review Sunday</p>
                    <div class="member-ticker">👥 Members: Dave → Eve</div>
                </a>
            </div>

            <div class="panel-white">
                <h3 style="margin:0 0 4px 0">Your Target Schedule Matrix</h3>
                <p style="font-size:12px; color:#64748b; margin:0 0 16px 0;" id="clock-node"></p>
                
                <div class="matrix-grid" id="schedule-matrix-target"></div>
            </div>
        </div>
    </div>

    <div id="group-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin:0">Create New Group</h3>
            <input type="text" placeholder="Group Name" style="padding:10px; border:1px solid #ccc; border-radius:4px;" />
            <input type="text" placeholder="Add Members" style="padding:10px; border:1px solid #ccc; border-radius:4px;" />
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="toggleModal(false)" style="padding: 8px 14px; background: #e2e8f0; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
                <button onclick="toggleModal(false)" class="btn-primary" style="padding: 8px 14px;">Build Group</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('clock-node').innerText = "Current Time: " + new Date().toLocaleString();

        const hoursData = ['09:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '01:00 PM', '02:00 PM', '03:00 PM', '04:00 PM'];

        function getDaysName(dayIndex) {
            const weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            return weekdays[dayIndex];
        }

        function renderScheduleMatrix() {
            const matrixContainer = document.getElementById('schedule-matrix-target');
            matrixContainer.innerHTML = '';
            
            const rawSaved = localStorage.getItem('globalWeeklyAvailability');
            const savedAvailability = rawSaved ? JSON.parse(rawSaved) : {};
            
            const currentDayName = getDaysName(new Date().getDay());

            hoursData.forEach(hour => {
                const slotElement = document.createElement('div');
                slotElement.className = 'time-slot';
                slotElement.innerText = hour;

                if (savedAvailability[currentDayName] && savedAvailability[currentDayName].includes(hour)) {
                    slotElement.classList.add('selected');
                }

                slotElement.addEventListener('click', () => {
                    slotElement.classList.toggle('selected');
                    
                    const isSelected = slotElement.classList.contains('selected');
                    const freshestSaved = localStorage.getItem('globalWeeklyAvailability');
                    const workingMap = freshestSaved ? JSON.parse(freshestSaved) : {};
                    
                    if (!workingMap[currentDayName]) workingMap[currentDayName] = [];
                    
                    if (isSelected) {
                        if (!workingMap[currentDayName].includes(hour)) workingMap[currentDayName].push(hour);
                    } else {
                        workingMap[currentDayName] = workingMap[currentDayName].filter(h => h !== hour);
                    }
                    
                    localStorage.setItem('globalWeeklyAvailability', JSON.stringify(workingMap));
                });

                matrixContainer.appendChild(slotElement);
            });
        }

        function toggleModal(show) { document.getElementById('group-modal').style.display = show ? 'flex' : 'none'; }
        function triggerNotifications() { alert("🔔 Notifications panel:\n• Invited to 'Hackathon Sync' by Frank\n• Event 'Milestone 2 Prep' created in Project Group 05"); }

        renderScheduleMatrix();
    </script>
</body>
</html>
